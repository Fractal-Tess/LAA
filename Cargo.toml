[package]
name = "league-auto-accept"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.28", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
base64 = "0.21"
regex = "1.8"

[dev-dependencies]
mockito = "1.2"
tempfile = "3.10"
tokio-test = "0.4"
